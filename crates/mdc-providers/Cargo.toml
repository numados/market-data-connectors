[package]
name = "mdc-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["native-tls"]
native-tls = ["tokio-tungstenite/native-tls", "reqwest?/default-tls"]
rustls = ["tokio-tungstenite/rustls-tls-webpki-roots", "reqwest?/rustls-tls"]
binance = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:reqwest",
    "dep:url",
    "dep:bytes",
    "dep:simd-json",
]
kraken = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:url",
    "dep:bytes",
    "dep:crc32fast",
]
coinbase = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:url",
    "dep:bytes",
]
bitfinex = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:url",
    "dep:bytes",
    "dep:crc32fast",
]
gateio = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:url",
    "dep:bytes",
]
bitstamp = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:reqwest",
    "dep:url",
    "dep:bytes",
]
lmax = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:url",
    "dep:bytes",
]
vwd = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:reqwest",
    "dep:url",
    "dep:bytes",
    "dep:secrecy",
]
huobi = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:url",
    "dep:bytes",
    "dep:flate2",
]
coinbase-advanced = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:url",
    "dep:bytes",
]
frankfurter = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:reqwest",
    "dep:url",
    "dep:bytes",
]
all = [
    "binance",
    "kraken",
    "coinbase",
    "bitfinex",
    "gateio",
    "bitstamp",
    "lmax",
    "vwd",
    "huobi",
    "coinbase-advanced",
    "frankfurter",
]

[dependencies]
mdc-core.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
smallstr.workspace = true

# Optional dependencies for providers
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
simd-json = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }



[dev-dependencies]
mdc-testkit.workspace = true
mdc-sinks.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
proptest.workspace = true
proptest-state-machine.workspace = true
wiremock.workspace = true
criterion.workspace = true
allocation-counter.workspace = true

[[bench]]
name = "binance_parse"
harness = false
required-features = ["binance"]

[[bench]]
name = "kraken_parse"
harness = false
required-features = ["kraken"]

[[bench]]
name = "kraken_checksum"
harness = false
required-features = ["kraken"]

[[bench]]
name = "coinbase_parse"
harness = false
required-features = ["coinbase"]

[[bench]]
name = "bitfinex_parse"
harness = false
required-features = ["bitfinex"]

[[bench]]
name = "bitfinex_checksum"
harness = false
required-features = ["bitfinex"]

[[bench]]
name = "gateio_parse"
harness = false
required-features = ["gateio"]

[[bench]]
name = "bitstamp_parse"
harness = false
required-features = ["bitstamp"]

[[bench]]
name = "lmax_parse"
harness = false
required-features = ["lmax"]

[[bench]]
name = "vwd_parse"
harness = false
required-features = ["vwd"]

[[bench]]
name = "huobi_parse"
harness = false
required-features = ["huobi"]

[[bench]]
name = "coinbase_advanced_parse"
harness = false
required-features = ["coinbase-advanced"]

[[bench]]
name = "frankfurter_parse"
harness = false
required-features = ["frankfurter"]



